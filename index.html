<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>НОЧНОЙ ЗАЕЗД</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Golos+Text:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070a12; --ink:#eaf1ff; --muted:#8a93ad;
    --acid:#c6ff00; --orange:#ff7a00; --cyan:#21e6ff;
    --magenta:#ff2d7e; --yellow:#ffd60a; --line:rgba(255,122,0,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Golos Text',sans-serif;
    background:
      radial-gradient(1100px 520px at 78% -8%, rgba(255,122,0,.20), transparent 60%),
      radial-gradient(900px 500px at -8% 108%, rgba(33,230,255,.13), transparent 55%),
      var(--bg);
    color:var(--ink); min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom)); overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0;
    background-image:repeating-linear-gradient(90deg, var(--line) 0 2px, transparent 2px 90px);
    mask:radial-gradient(circle at 50% 60%, #000 0%, transparent 78%);
    opacity:.6; pointer-events:none; z-index:0; animation:road 6s linear infinite;
  }
  @keyframes road{from{background-position:0 0} to{background-position:-90px 0}}
  .stage{position:relative; z-index:1; width:100%; max-width:560px; margin-top:8px;}
  .card{
    background:linear-gradient(180deg, rgba(14,18,30,.94), rgba(7,10,18,.97));
    border:1.5px solid rgba(255,122,0,.28); border-radius:20px; padding:26px 22px 28px;
    box-shadow:0 24px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .tag{display:inline-block; font-family:'Unbounded',sans-serif; font-weight:800; font-size:10.5px; letter-spacing:.24em; text-transform:uppercase; color:#070a12; background:var(--orange); padding:6px 12px; border-radius:999px; margin-bottom:16px; transform:rotate(-2deg);}
  h1{font-family:'Unbounded',sans-serif; font-weight:900; font-size:clamp(30px,9vw,48px); line-height:.9; letter-spacing:-.02em; margin-bottom:8px; background:linear-gradient(92deg,var(--orange),var(--yellow) 50%,var(--acid)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .sub{font-family:'Unbounded',sans-serif; font-weight:700; font-size:13px; letter-spacing:.1em; color:var(--cyan); text-transform:uppercase; margin-bottom:8px;}
  .hi{font-size:14px; color:var(--acid); font-weight:700; margin-bottom:14px;}
  .lead{color:var(--muted); font-size:14.5px; line-height:1.55; margin-bottom:18px;}
  .roster{display:flex; flex-direction:column; gap:8px; margin-bottom:22px;}
  .pers{font-size:13.5px; line-height:1.4; padding-left:13px; border-left:2px solid var(--orange);}
  .pers b{font-family:'Unbounded',sans-serif; font-weight:700; font-size:12.5px;}
  .pers .you{color:var(--acid);} .pers .o{color:var(--cyan);} .pers span.r{color:var(--muted);}
  .btn{width:100%; cursor:pointer; border:none; font-family:'Unbounded',sans-serif; font-weight:800; font-size:15px; letter-spacing:.02em; color:#070a12; background:var(--orange); border-radius:14px; padding:15px; margin-top:6px; transition:.15s; text-transform:uppercase; box-shadow:0 7px 0 #a35000;}
  .btn:active{transform:translateY(4px); box-shadow:0 3px 0 #a35000;}
  .hud{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:12px;}
  .crew{font-size:11px; color:var(--muted); line-height:1.45;}
  .crew b{color:var(--cyan); font-weight:700;}
  .meter{flex:0 0 140px;}
  .meter .lab{font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; text-align:right; font-weight:700;}
  .bar{height:11px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; border:1px solid rgba(255,255,255,.1);}
  .bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--magenta),var(--orange),var(--acid)); transition:width .5s cubic-bezier(.2,.9,.2,1);}
  .scene-text{font-size:16.5px; line-height:1.62; margin-bottom:24px; min-height:84px;}
  .scene-text .nm{font-family:'Unbounded',sans-serif; font-weight:700; font-size:14.5px;}
  .scene-text .me{color:var(--acid);} .scene-text .fr{color:var(--cyan);}
  .scene-text em{color:var(--yellow); font-style:normal; font-weight:700;}
  .choice{display:block; width:100%; text-align:left; cursor:pointer; background:rgba(255,255,255,.04); border:1.5px solid rgba(255,255,255,.12); border-radius:14px; padding:14px 16px; margin-bottom:10px; color:var(--ink); font-family:inherit; font-size:15px; font-weight:500; transition:.16s;}
  .choice:active{border-color:var(--orange); background:rgba(255,122,0,.12);}
  .choice::before{content:"▸"; color:var(--orange); font-weight:900; margin-right:9px;}
  .ending h2{font-family:'Unbounded',sans-serif; font-weight:900; font-size:clamp(24px,7vw,38px); line-height:1; margin-bottom:14px; letter-spacing:-.01em;}
  .ending .verdict{font-size:15.5px; line-height:1.6; color:var(--muted); margin-bottom:22px;}
  .restart{background:var(--cyan); box-shadow:0 7px 0 #168fa0;}
  .restart:active{box-shadow:0 3px 0 #168fa0;}
  .fade{animation:fade .4s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
</style>
</head>
<body>
<div class="stage"><div class="card" id="card"></div></div>
<script>
/* ===== TELEGRAM SDK ===== */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
let TG_NAME = "";
if(tg){
  try{
    tg.ready(); tg.expand();
    tg.setHeaderColor && tg.setHeaderColor('#070a12');
    tg.setBackgroundColor && tg.setBackgroundColor('#070a12');
    tg.disableVerticalSwipes && tg.disableVerticalSwipes();
    const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if(u && u.first_name) TG_NAME = u.first_name;
  }catch(e){}
}
function buzz(kind){
  if(!tg || !tg.HapticFeedback) return;
  try{
    if(kind==='ok') tg.HapticFeedback.notificationOccurred('success');
    else if(kind==='bad') tg.HapticFeedback.notificationOccurred('error');
    else tg.HapticFeedback.impactOccurred('medium');
  }catch(e){}
}

/* ===== БАНДА ===== */
const N = {
  S:`<span class="nm me">Семён</span>`, M:`<span class="nm fr">Макс</span>`,
  SA:`<span class="nm fr">Саша</span>`, NK:`<span class="nm fr">Никита</span>`,
  G:`<span class="nm fr">Горыня</span>`, Z:`<span class="nm fr">Зилотов</span>`
};
const S = { hype:50 };
const $ = id=>document.getElementById(id);
const card = $('card');
function t(str){return str.replace(/\{S\}/g,N.S).replace(/\{M\}/g,N.M).replace(/\{SA\}/g,N.SA).replace(/\{NK\}/g,N.NK).replace(/\{G\}/g,N.G).replace(/\{Z\}/g,N.Z);}

/* ===== ТИТУЛКА ===== */
function title(){
  S.hype=50;
  if(tg && tg.BackButton) tg.BackButton.hide();
  card.className="card fade";
  card.innerHTML=`
    <span class="tag">★ сюжетный режим</span>
    <h1>НОЧНОЙ<br>ЗАЕЗД</h1>
    <div class="sub">пятнашка Макса · одна ночь</div>
    ${TG_NAME?`<div class="hi">здарова, ${TG_NAME}! 🤝 сегодня ты — Семён</div>`:''}
    <p class="lead">Гаражи, ночь, прогретая ВАЗ 2115 и банда в сборе. Один выезд, сто поворотов сюжета. Куда вывезет ночь — решаешь ты.</p>
    <div class="roster">
      <div class="pers"><b class="you">Семён</b> <span class="r">— ты, спортсмен. Догонит, вынесет, перепрыгнет.</span></div>
      <div class="pers"><b class="o">Макс</b> <span class="r">— за рулём пятнашки. Без него никуда.</span></div>
      <div class="pers"><b class="o">Саша</b> <span class="r">— что трогает — ломается.</span></div>
      <div class="pers"><b class="o">Никита</b> <span class="r">— самый молодой, всему верит.</span></div>
      <div class="pers"><b class="o">Горыня</b> <span class="r">— шкаф. Толкает, держит, ломает заборы.</span></div>
      <div class="pers"><b class="o">Зилотов</b> <span class="r">— рыжий магнит для дичи.</span></div>
    </div>
    <button class="btn" id="go">Завести двигатель →</button>`;
  $('go').onclick=()=>{buzz('hit'); render('intro');};
}

function hud(){
  const pct=Math.max(0,Math.min(100,S.hype));
  return `<div class="hud"><div class="crew">ЗА РУЛЁМ: <b>Макс</b> · ТЫ: <b>Семён</b></div>
    <div class="meter"><div class="lab">уровень угара</div>
    <div class="bar"><i style="width:${pct}%"></i></div></div></div>`;
}

function render(key){
  const sc=SCENES[key]; if(!sc) return;
  if(typeof sc.hype==='number') S.hype+=sc.hype;
  if(tg && tg.BackButton){ tg.BackButton.show(); tg.BackButton.onClick(title); }
  if(sc.ending){
    buzz(S.hype>=55?'ok':'bad');
    card.className="card fade ending";
    card.innerHTML=`${hud()}
      <span class="tag" style="background:${sc.color||'var(--yellow)'}">${sc.badge||'КОНЕЦ'}</span>
      <h2 style="color:${sc.color||'var(--yellow)'}">${t(sc.title)}</h2>
      <p class="verdict">${t(sc.text)}</p>
      <button class="btn restart" id="rs">Ещё заезд ↺</button>`;
    $('rs').onclick=()=>{buzz('hit'); title();};
    return;
  }
  let html=hud()+`<p class="scene-text">${t(sc.text)}</p>`;
  sc.choices.forEach(c=>{html+=`<button class="choice" data-n="${c.next}">${t(c.label)}</button>`;});
  card.className="card fade"; card.innerHTML=html;
  card.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{buzz('hit'); render(b.dataset.n);});
  window.scrollTo(0,0);
}

/* ===== СЮЖЕТ ===== */
const SCENES = {
  intro:{text:`Гаражи, полночь. {M} подкатывает на прогретой пятнашке, движок тарахтит как родной. Банда заваливается внутрь. И тут {S} вспоминает: {SA} сегодня сломал его любимую удочку. {SA} сразу: «Да она сама! Я только взял подержать!»`,
    choices:[{label:`«Забей, погнали кататься»`,next:"ride1"},{label:`«Не, {SA}, мы это так не оставим»`,next:"udochka"}]},
  udochka:{text:`{S} подходит к {SA} вплотную. {G} ржёт сзади: «Ну всё, спортсмен зол.» {SA} вжимается в сиденье: «Я куплю новую! Завтра! Когда-нибудь!»`,hype:6,
    choices:[{label:`«Едем за удочкой прямо сейчас»`,next:"shop"},{label:`«Ладно, должник. Поехали»`,next:"ride1"}]},
  shop:{text:`Круглосуточный рыболовный — единственный на город. {SA} с кислой миной достаёт мятые купюры. Пока он платит, {Z} замечает за магазином толпу и мигалки: «Пацаны! Там чёт происходит! Го глянем!»`,hype:8,
    choices:[{label:`«Берём удочку и валим»`,next:"ride1"},{label:`«Зилотов прав, глянем»`,next:"crowd"}]},
  crowd:{text:`Подъезжаете — ночные покатушки, сходка тачек. Парень у тюнингованной машины тычет в пятнашку {M}: «Это ЭТО приехало гоняться? Прокатимся до светофора?»`,hype:12,
    choices:[{label:`«{M}, покажи им пятнашку!»`,next:"race"},{label:`«Мы мимо, удачи»`,next:"cruise"}]},
  ride1:{text:`Пятнашка летит по пустому ночному городу, из колонок орёт музыка, {NK} подпевает не зная слов. {Z} высовывается с заднего сиденья: «Пацаны! Я знаю где сегодня реальный движ! Поворачивай!»`,hype:5,
    choices:[{label:`«Едем за Зилотовым»`,next:"crowd"},{label:`«Твои движи добром не кончаются. Катаемся»`,next:"cruise"}]},
  cruise:{text:`Спокойный круиз, окна нараспашку, кайф. И тут пятнашка <em>кхе-кхе-тыдых</em> — и глохнет посреди пустой дороги. {M} крутит ключ — тишина. {SA}: «Я ничего не трогал... почти.»`,hype:3,
    choices:[{label:`«{G}, {S} — толкаем!»`,next:"push"},{label:`«{M} лезет под капот, Саша НЕ помогает»`,next:"hood"}]},
  push:{text:`{G} упирается в багажник как танк, {S} рядом — два кабана толкают пятнашку под горку. {M} орёт «бросаю сцепление!». Движок чихает... и тут {Z}: «Можно я тоже подтолкну?» — и спотыкается прямо под колёса.`,hype:7,
    choices:[{label:`«{S} в прыжке выдёргивает рыжего!»`,next:"hero_save"},{label:`«Все тормозят, спасаем Зилотова»`,next:"hero_save"}]},
  hood:{text:`{M} ныряет под капот с фонариком. «Так, провод отошёл, ща...» И тут {SA}, которому сказали НЕ ЛЕЗТЬ, тянется «помочь» и отрывает трубку. <em>Пшшш.</em> {M} медленно поднимает голову. {SA}: «Это и так болталось!»`,hype:9,
    choices:[{label:`«{S} оттаскивает Сашу, чинят с Максом»`,next:"fix"},{label:`«Зовём Горыню толкать до сервиса»`,next:"push"}]},
  hero_save:{text:`{S} срывается с места и в красивом прыжке выдёргивает {Z} из-под колёс. Пятнашка с рёвом заводится, банда хлопает. {G}: «Вот это спорт! Семён, ты машина!» {Z}: «Я бы и сам отскочил... наверное.»`,hype:14,
    choices:[{label:`«Догоняем тачку и едем дальше в ночь»`,next:"final_cruise"}]},
  fix:{text:`{S} держит {SA} за шкирку на безопасном расстоянии, пока {M} возвращает трубку на место. Движок мурчит. {M}: «{SA}, ещё раз тронешь машину — поедешь в багажнике.» {SA}: «Понял. Молчу.»`,hype:8,
    choices:[{label:`«Поехали, ночь молодая»`,next:"final_cruise"}]},
  race:{text:`{M} жмёт газ, пятнашка ревёт всем что есть. До светофора ноздря в ноздрю! На последних метрах тюнинг глохнет, а пятнашка с тарахтением вырывается вперёд. ПОБЕДА. {NK} визжит, {G} трясёт машину так, что она качается.`,hype:20,
    choices:[{label:`«Уезжаем красиво, легендами»`,next:"race_end"},{label:`«Остаёмся, {Z} зовёт на ещё заезд»`,next:"final_cruise"}]},
  final_cruise:{text:`Под утро пятнашка катит по набережной, небо розовеет. {NK} спит на плече у {G}. {Z}, конечно: «Пацаны... а есть идея на завтра...» {M} смотрит на {S} в зеркало: «Ну чё, командир, как закончим эту?»`,hype:6,
    choices:[{label:`«Глушим мотор, по домам»`,next:"good_end"},{label:`«За пирожками на круглосуточную!»`,next:"pirozhki_end"},{label:`«Слушаем идею Зилотова (ошибка?)»`,next:"zil_end"}]},
  race_end:{ending:true,badge:"ЛЕГЕНДА РАЙОНА",color:"var(--acid)",title:`Пятнашка, которая всех уделала`,hype:18,
    text:`Старая ВАЗ 2115 {M} обогнала тюнинг на глазах у всей сходки. Теперь о вас говорят во всех гаражах. {SA} рассказывает историю так, будто сам сидел за рулём. {S} — штурман года. Машину {M} больше не зовут «корыто» — только «Молния».`},
  good_end:{ending:true,badge:"ХОРОШИЙ ВЕЧЕР",color:"var(--cyan)",title:`Просто отличная ночь`,hype:5,
    text:`Никто не пострадал, пятнашка цела, удочка отомщена, {SA} весь вечер вёл себя прилично (рекорд). Разъехались по домам на рассвете. Иногда лучшая ночь — это когда все доехали живые и ржущие.`},
  pirozhki_end:{ending:true,badge:"НАРОДНЫЕ ГЕРОИ",color:"var(--yellow)",title:`Налёт на круглосуточную`,hype:12,
    text:`Вы скупили все горячие пирожки. {G} взял восемь, {NK} — два и сразу обжёгся. {S} честно поделил последний на всех. Тётя Люда теперь держит для вас лучшие. Ночь, которая пахнет ливером и победой.`},
  zil_end:{ending:true,badge:"А МЫ ГОВОРИЛИ",color:"var(--magenta)",title:`Зря послушали рыжего`,hype:-10,
    text:`Идея {Z} звучала гениально ровно до момента, когда пятнашка застряла в грязи на поле, {SA} утопил кроссовок, а {NK} клялся, что видел инопланетян. {S} вытаскивал всех на руках. Зачем поехали — никто не помнит. Но {Z} уже придумал следующую идею. Банда обречена. И это прекрасно.`}
};

title();
</script>
</body>
</html>
