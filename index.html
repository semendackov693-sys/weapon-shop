<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weapon Shop Tycoon Mini</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #2c3e50;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; color: white; user-select: none;
        }
        .screen {
            width: 100%; max-width: 390px; height: 100vh; max-height: 844px;
            background-color: #7da15d; box-shadow: 0 0 30px rgba(0,0,0,0.7);
            position: relative; display: flex; flex-direction: column; overflow-y: auto;
        }
        .top-bar {
            background-color: rgba(49, 37, 30, 0.95); padding: 15px;
            display: flex; justify-content: space-between;
            font-weight: bold; font-size: 18px; border-bottom: 3px solid #ffd700;
            position: sticky; top: 0; z-index: 10;
        }
        .gold { color: #ffd700; }
        .game-field { flex: 1; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        
        /* Стили верстаков */
        .workbench {
            background: #f1e4c3; color: #31251e; width: 100%; border-radius: 15px;
            border: 3px solid #8B4513; padding: 15px; box-shadow: 0 6px 0 #8B4513; box-sizing: border-box;
        }
        .locked { background: #9e9e9e; border-color: #555; box-shadow: 0 6px 0 #555; text-align: center; color: #fff; padding: 30px 15px; }
        .wb-header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; }
        .wb-level { font-size: 14px; background: #8B4513; color: white; padding: 3px 10px; border-radius: 8px; }
        .progress-box { background-color: #d7ccc8; border-radius: 10px; height: 16px; width: 100%; margin: 10px 0; overflow: hidden; border: 2px solid #31251e; }
        .progress-fill { background-color: #4caf50; width: 0%; height: 100%; }
        .up-btn { background: #4caf50; color: white; border: none; border-radius: 10px; padding: 10px 0; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #2e7d32; }
        .up-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #2e7d32; }
        .unlock-btn { background: #ff9800; box-shadow: 0 4px 0 #e65100; margin-top: 10px; }

        .factory-floor { width: 100%; height: 110px; background-color: rgba(0,0,0,0.15); border-radius: 15px; position: relative; border: 2px dashed rgba(255,255,255,0.3); margin-top: auto; }
        .worker { position: absolute; bottom: 15px; left: 30px; font-size: 28px; transition: left 1.5s ease-in-out; }
        .bottom-menu { background: #31251e; height: 60px; display: flex; justify-content: space-around; align-items: center; border-top: 3px solid #8B4513; position: sticky; bottom: 0; }
        .menu-item { font-size: 24px; }
    </style>
</head>
<body>

<div class="screen">
    <div class="top-bar">
        <div class="gold">💰 <span id="gold-display">0</span></div>
        <div>👥 <span id="workers-count">1</span>/5</div>
        <div style="color: #ff4081;">💎 22</div>
    </div>

    <div class="game-field">
        <!-- ВЕРСТАК 1: МЕЧИ -->
        <div class="workbench">
            <div class="wb-header">
                <span>⚔️ Sword Workbench</span>
                <span class="wb-level" id="wb1-lvl">Level 112</span>
            </div>
            <div style="font-size:14px; color:#555; margin:5px 0;">Доход: +<span id="wb1-income">672.5M</span> 💰</div>
            <div class="progress-box"><div class="progress-fill" id="wb1-progress"></div></div>
            <button class="up-btn" onclick="upgradeWb(1)">🟢 <span id="wb1-cost">4.38B</span></button>
        </div>

        <!-- ВЕРСТАК 2: ТОПОРЫ (Сначала заблокирован) -->
        <div id="wb2-container" class="workbench locked">
            <h3>🪓 Axe Workbench</h3>
            <p style="color: #eee;">Откройте производство боевых топоров!</p>
            <button class="up-btn unlock-btn" onclick="unlockWb2()">🔓 Купить за 50B</button>
        </div>
        
        <!-- Поле с рабочим -->
        <div class="factory-floor">
            <div class="worker" id="game-worker">🧑‍🏭</div>
        </div>
    </div>

    <div class="bottom-menu">
        <div class="menu-item">🔨</div><div class="menu-item">⚔️</div><div class="menu-item">🏪</div>
    </div>
</div>

<script>
    function format(num) {
        if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
        if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
        if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
        if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
        return num.toFixed(0);
    }

    // Загрузка сохранений или запуск заново
    let gold = Number(localStorage.getItem('tg_gold')) || 4400000000; // Начнем с 4.4B, чтобы сразу хватило на первый апгрейд!
    
    let wb1 = { level: Number(localStorage.getItem('wb1_lvl')) || 112, income: Number(localStorage.getItem('wb1_inc')) || 672500000, cost: Number(localStorage.getItem('wb1_cst')) || 4380000000, progress: 0 };
    let wb2 = { active: localStorage.getItem('wb2_act') === 'true', level: Number(localStorage.getItem('wb2_lvl')) || 1, income: 2500000000, cost: 60000000000, progress: 0 };
    
    let isMovingRight = true;

    // Сохранение данных в память браузера
    function saveGame() {
        localStorage.setItem('tg_gold', gold);
        localStorage.setItem('wb1_lvl', wb1.level);
        localStorage.setItem('wb1_inc', wb1.income);
        localStorage.setItem('wb1_cst', wb1.cost);
        localStorage.setItem('wb2_act', wb2.active);
        localStorage.setItem('wb2_lvl', wb2.level);
    }

    // Главный цикл (Шкалы прогресса)
    setInterval(() => {
        // Верстак 1
        wb1.progress += 2.5;
        if (wb1.progress > 100) { wb1.progress = 0; gold += wb1.income; saveGame(); }
        document.getElementById("wb1-progress").style.width = wb1.progress + "%";

        // Верстак 2 (если куплен)
        if (wb2.active) {
            wb2.progress += 1.5;
            if (wb2.progress > 100) { wb2.progress = 0; gold += wb2.income; saveGame(); }
            document.getElementById("wb2-progress").style.width = wb2.progress + "%";
        }
        document.getElementById("gold-display").innerText = format(gold);
    }, 40);

    // Кузнец бегает
    setInterval(() => {
        const worker = document.getElementById("game-worker");
        worker.style.left = isMovingRight ? "310px" : "30px";
        worker.innerText = isMovingRight ? "🏃‍♂️" : "🧑‍🏭";
        isMovingRight = !isMovingRight;
    }, 1500);

    function upgradeWb(id) {
        if (id === 1 && gold >= wb1.cost) {
            gold -= wb1.cost; wb1.level++; wb1.income *= 1.35; wb1.cost *= 1.5;
            document.getElementById("wb1-lvl").innerText = "Level " + wb1.level;
            document.getElementById("wb1-income").innerText = format(wb1.income);
            document.getElementById("wb1-cost").innerText = format(wb1.cost);
        } else if (id === 2 && gold >= wb2.cost) {
            gold -= wb2.cost; wb2.level++; wb2.income *= 1.4; wb2.cost *= 1.6;
            document.getElementById("wb2-lvl").innerText = "Level " + wb2.level;
            document.getElementById("wb2-income").innerText = format(wb2.income);
            document.getElementById("wb2-cost").innerText = format(wb2.cost);
        } else { alert("Мало золота! 🪙"); }
        saveGame();
    }

    function unlockWb2() {
        if (gold >= 50000000000) { // 50B цена открытия
            gold -= 50000000000; wb2.active = true;
            document.getElementById("workers-count").innerText = "2";
            renderWb2(); saveGame();
        } else { alert("Нужно 50B золота, чтобы открыть верстак Топоров!"); }
    }

    function renderWb2() {
        if (wb2.active) {
            document.getElementById("wb2-container").className = "workbench";
            document.getElementById("wb2-container").innerHTML = `
                <div class="wb-header"><span>🪓 Axe Workbench</span><span class="wb-level" id="wb2-lvl">Level ${wb2.level}</span></div>
                <div style="font-size:14px; color:#555; margin:5px 0;">Доход: +<span id="wb2-income">${format(wb2.income)}</span> 💰</div>
                <div class="progress-box"><div class="progress-fill" id="wb2-progress"></div></div>
                <button class="up-btn" onclick="upgradeWb(2)">🟢 <span id="wb2-cost">${format(wb2.cost)}</span></button>
            `;
        }
    }
    renderWb2(); if(wb2.active) document.getElementById("workers-count").innerText = "2";
</script>
</body>
</html>
