<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Weapon Shop Idle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { user-select: none; touch-action: manipulation; }
        body { margin: 0; background: #1a472a; overflow: hidden; font-family: system-ui; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #86bf6c; }
        .ui-panel {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(12px);
            padding: 12px; display: flex; flex-wrap: wrap; gap: 8px;
            justify-content: space-between; z-index: 10; color: #FFE4B5;
            border-radius: 20px 20px 0 0; font-size: 14px; font-weight: bold;
        }
        button {
            background: #f4a261; border: none; border-radius: 60px;
            padding: 8px 16px; font-weight: bold; cursor: pointer;
        }
        button:active { transform: scale(0.96); }
        .stat { background: #000000aa; padding: 4px 12px; border-radius: 40px; }
    </style>
</head>
<body>
<div>
    <canvas id="gameCanvas"></canvas>
    <div class="ui-panel">
        <div class="stat">💰 <span id="gold">500</span></div>
        <div class="stat">⚔️ <span id="weapons">0</span></div>
        <div class="stat">⭐ <span id="reputation">0</span></div>
        <button id="sellBtn">Продать всё</button>
        <button id="upgradeBtn">📈 Кузнец +1 (50💰)</button>
    </div>
</div>
<script>
    // ========== ОСНОВНАЯ ИГРА ==========
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    let gold = 500;
    let weapons = 0;
    let reputation = 0;
    let blacksmiths = 1;
    
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
    }
    window.addEventListener('resize', resize);
    
    function draw() {
        ctx.fillStyle = '#86bf6c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#6b4c3b';
        ctx.fillRect(canvas.width/2-50, canvas.height/2-50, 100, 80);
        ctx.fillStyle = '#e9c58b';
        ctx.font = "30px system-ui";
        ctx.fillText("🔨", canvas.width/2-20, canvas.height/2+10);
        ctx.fillStyle = '#f7c873';
        for(let i=0; i<blacksmiths; i++) {
            ctx.beginPath();
            ctx.arc(100 + i*40, canvas.height-80, 20, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.fillText("👨‍🏭", 85 + i*40, canvas.height-85);
            ctx.fillStyle = '#f7c873';
        }
    }
    
    function updateUI() {
        document.getElementById('gold').innerText = Math.floor(gold);
        document.getElementById('weapons').innerText = Math.floor(weapons);
        document.getElementById('reputation').innerText = Math.floor(reputation);
        document.getElementById('upgradeBtn').innerHTML = `📈 Кузнец +1 (${Math.floor(50 + blacksmiths*15)}💰)`;
    }
    
    function sellAll() {
        if(weapons > 0) {
            let price = 12 + Math.floor(reputation / 10);
            let total = weapons * price;
            gold += total;
            weapons = 0;
            tg.HapticFeedback.notificationOccurred('success');
            updateUI();
            draw();
        }
    }
    
    function buyBlacksmith() {
        let cost = 50 + blacksmiths * 15;
        if(gold >= cost) {
            gold -= cost;
            blacksmiths++;
            updateUI();
            draw();
        }
    }
    
    // Ковка оружия каждые 2 секунды
    setInterval(() => {
        let crafted = blacksmiths;
        weapons += crafted;
        updateUI();
        draw();
    }, 2000);
    
    document.getElementById('sellBtn').onclick = sellAll;
    document.getElementById('upgradeBtn').onclick = buyBlacksmith;
    
    resize();
    updateUI();
</script>
</body>
</html>
