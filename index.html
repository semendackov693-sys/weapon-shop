<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Idle Weapon Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 16px;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #1f2a36);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        h1, h2, h3 {
            margin: 0 0 8px 0;
        }
        .gold {
            color: #f5b042;
            font-weight: bold;
        }
        .ore {
            color: #b0a37c;
        }
        .gem {
            color: #5dade2;
        }
        button {
            background: var(--tg-theme-button-color, #2d7a4b);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
            width: 100%;
            margin-top: 8px;
        }
        button:active {
            transform: scale(0.97);
            opacity: 0.9;
        }
        .upgrade-btn {
            background: var(--tg-theme-secondary-bg-color, #2c3e50);
            border: 1px solid var(--tg-theme-hint-color, #5e7a93);
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .progress-bar {
            background: #2c3e50;
            border-radius: 20px;
            height: 8px;
            overflow: hidden;
            margin: 12px 0;
        }
        .progress-fill {
            background: #f5b042;
            width: 0%;
            height: 100%;
            transition: width 0.3s;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .center {
            text-align: center;
        }
        .icon {
            font-size: 24px;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="card">
        <div class="flex">
            <span class="icon">⚔️</span>
            <h2>Idle Weapon Shop</h2>
            <span class="icon">🛠️</span>
        </div>
        <div class="flex" style="margin-top: 12px;">
            <div><span class="gold">💰</span> <span id="gold">0</span></div>
            <div><span class="ore">🪨</span> <span id="ore">0</span></div>
            <div><span class="gem">💎</span> <span id="gems">0</span></div>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="prestige-progress"></div>
        </div>
        <div class="flex" style="font-size: 14px;">
            <span>⚡ <span id="production">0</span>/мин</span>
            <span>👨‍🏭 <span id="blacksmiths">1</span></span>
            <span>🔥 До престижа: <span id="prestige-percent">0</span>%</span>
        </div>
    </div>

    <div class="grid-2">
        <div class="card center">
            <div class="icon">🔨</div>
            <div><strong>Ковать меч</strong></div>
            <div id="craft-cost">10🪨</div>
            <button id="craftBtn">Ковать</button>
        </div>
        <div class="card center">
            <div class="icon">💰</div>
            <div><strong>Продать всё</strong></div>
            <div id="sell-value">+0🪙</div>
            <button id="sellBtn">Продать</button>
        </div>
    </div>

    <div class="card">
        <h3>🏪 Улучшения</h3>
        <div class="flex">
            <span>⚡ Кузнецы (+1/мин)</span>
            <span id="blacksmithCost" class="gold">50🪙</span>
            <button id="buyBlacksmith" class="upgrade-btn" style="width: auto;">Нанять</button>
        </div>
        <div class="flex">
            <span>💪 Сила продаж (+5% цены)</span>
            <span id="profitCost" class="gold">100🪙</span>
            <button id="buyProfit" class="upgrade-btn" style="width: auto;">Купить</button>
        </div>
        <div class="flex">
            <span>⛏️ Шахта (+1 руда/мин)</span>
            <span id="mineCost" class="gold">80🪙</span>
            <button id="buyMine" class="upgrade-btn" style="width: auto;">Улучшить</button>
        </div>
    </div>

    <div class="card">
        <h3>🏆 Лидеры (ваш прогресс)</h3>
        <div id="leaderboard">Загрузка...</div>
    </div>
</div>

<script>
    // ---------- ИГРОВАЯ ЛОГИКА ----------
    let tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Стартовые значения
    let gold = 100;
    let ore = 20;
    let gems = 0;
    let blacksmiths = 1;     // 1 меч/мин за кузнеца
    let profitLevel = 0;     // +5% за уровень
    let mineLevel = 0;       // +1 руда/мин
    let prestigeCount = 0;

    const BASE_SWORD_PRICE = 15;
    const ORE_PER_SWORD = 10;
    const TIME_TICK = 2000;   // 2 секунды тик (для удобства теста)
    let lastUpdate = Date.now();

    // Загрузка из localStorage (оффлайн-прогресс)
    function loadGame() {
        let saved = localStorage.getItem('weaponShop');
        if (saved) {
            try {
                let data = JSON.parse(saved);
                let now = Date.now();
                let minutesOffline = (now - data.lastSave) / 1000 / 60;
                if (minutesOffline > 0 && minutesOffline < 480) { // до 8 часов
                    let oreGain = (data.mineLevel + 1) * minutesOffline;
                    let goldGain = (data.blacksmiths * minutesOffline) * (BASE_SWORD_PRICE * (1 + data.profitLevel * 0.05));
                    gold = data.gold + Math.floor(goldGain);
                    ore = data.ore + Math.floor(oreGain);
                    gems = data.gems;
                    blacksmiths = data.blacksmiths;
                    profitLevel = data.profitLevel;
                    mineLevel = data.mineLevel;
                    prestigeCount = data.prestigeCount || 0;
                } else {
                    gold = data.gold;
                    ore = data.ore;
                    gems = data.gems;
                    blacksmiths = data.blacksmiths;
                    profitLevel = data.profitLevel;
                    mineLevel = data.mineLevel;
                    prestigeCount = data.prestigeCount || 0;
                }
            } catch(e) { console.warn(e); }
        }
        saveGame();
    }
    function saveGame() {
        let data = {
            gold, ore, gems, blacksmiths, profitLevel, mineLevel, prestigeCount,
            lastSave: Date.now()
        };
        localStorage.setItem('weaponShop', JSON.stringify(data));
    }

    // Динамические цены
    function blacksmithCost() { return 50 + blacksmiths * 20; }
    function profitCost() { return 100 + profitLevel * 50; }
    function mineCost() { return 80 + mineLevel * 40; }

    // Производство в минуту
    function getOrePerMin() { return mineLevel + 1; }
    function getSwordsPerMin() { return blacksmiths; }
    function getSwordPrice() { return Math.floor(BASE_SWORD_PRICE * (1 + profitLevel * 0.05)); }
    function getGoldPerMin() { return getSwordsPerMin() * getSwordPrice(); }

    // Крафт меча
    function craftSword() {
        let costOre = ORE_PER_SWORD;
        if (ore >= costOre) {
            ore -= costOre;
            // автоматически добавляем меч на склад (упрощённо - сразу даём золото при продаже поштучно, но здесь просто увеличим склад)
            // для простоты: мечи храним неявно, продажа через кнопку "Продать всё"
            if (!window.inventory) window.inventory = 0;
            window.inventory = (window.inventory || 0) + 1;
            tg.HapticFeedback.impactOccurred('light');
            updateUI();
            saveGame();
        } else {
            tg.showPopup({ title: "Не хватает", message: `Нужно ${costOre} руды` });
        }
    }
    function sellAll() {
        let inv = window.inventory || 0;
        if (inv === 0) return;
        let priceEach = getSwordPrice();
        let total = inv * priceEach;
        gold += total;
        window.inventory = 0;
        tg.HapticFeedback.notificationOccurred('success');
        updateUI();
        saveGame();
    }
    function buyBlacksmith() {
        let cost = blacksmithCost();
        if (gold >= cost) {
            gold -= cost;
            blacksmiths++;
            updateUI();
            saveGame();
        }
    }
    function buyProfit() {
        let cost = profitCost();
        if (gold >= cost) {
            gold -= cost;
            profitLevel++;
            updateUI();
            saveGame();
        }
    }
    function buyMine() {
        let cost = mineCost();
        if (gold >= cost) {
            gold -= cost;
            mineLevel++;
            updateUI();
            saveGame();
        }
    }

    // Оффлайн-тик (добыча руды и ковка в фоне)
    function productionTick() {
        let now = Date.now();
        let diffMinutes = (now - lastUpdate) / 1000 / 60;
        if (diffMinutes > 0.1) {
            let oreGain = getOrePerMin() * diffMinutes;
            ore += oreGain;
            let swordsGained = getSwordsPerMin() * diffMinutes;
            if (!window.inventory) window.inventory = 0;
            window.inventory += swordsGained;
            lastUpdate = now;
            updateUI();
            saveGame();
        }
    }
    setInterval(() => productionTick(), TIME_TICK);

    // UI обновление
    function updateUI() {
        document.getElementById('gold').innerText = Math.floor(gold);
        document.getElementById('ore').innerText = Math.floor(ore);
        document.getElementById('gems').innerText = gems;
        document.getElementById('blacksmiths').innerText = blacksmiths;
        document.getElementById('production').innerText = getGoldPerMin();
        document.getElementById('craft-cost').innerHTML = `${ORE_PER_SWORD}🪨`;
        let sellTotal = (window.inventory || 0) * getSwordPrice();
        document.getElementById('sell-value').innerHTML = `+${Math.floor(sellTotal)}🪙`;

        document.getElementById('blacksmithCost').innerHTML = `${Math.floor(blacksmithCost())}🪙`;
        document.getElementById('profitCost').innerHTML = `${Math.floor(profitCost())}🪙`;
        document.getElementById('mineCost').innerHTML = `${Math.floor(mineCost())}🪙`;

        let totalEarned = gold;
        let neededForPrestige = 50000;
        let percent = Math.min(100, Math.floor((totalEarned / neededForPrestige) * 100));
        document.getElementById('prestige-percent').innerText = percent;
        document.getElementById('prestige-progress').style.width = percent + '%';

        let topPlayers = [
            { name: "Игрок_1", gold: 124000 },
            { name: "Кузнец228", gold: 89000 },
            { name: "Ты", gold: Math.floor(gold) }
        ];
        let leaderHtml = topPlayers.map(p => `<div>${p.name}: ${Math.floor(p.gold)}🪙</div>`).join('');
        document.getElementById('leaderboard').innerHTML = leaderHtml;
    }

    // Привязка кнопок
    document.getElementById('craftBtn').onclick = () => { craftSword(); updateUI(); };
    document.getElementById('sellBtn').onclick = () => { sellAll(); updateUI(); };
    document.getElementById('buyBlacksmith').onclick = () => { buyBlacksmith(); updateUI(); };
    document.getElementById('buyProfit').onclick = () => { buyProfit(); updateUI(); };
    document.getElementById('buyMine').onclick = () => { buyMine(); updateUI(); };

    // Первоначальный запуск
    loadGame();
    if (!window.inventory) window.inventory = 0;
    lastUpdate = Date.now();
    updateUI();

    // Telegram MainButton для престижа (опционально)
    tg.MainButton.setText("🌟 Перерождение (50k золота)");
    tg.MainButton.show();
    tg.MainButton.onClick(() => {
        if (gold >= 50000) {
            gold -= 50000;
            prestigeCount++;
            // бонус престижа: +1 кузнец, +1 шахта, +2 кристалла
            blacksmiths += 1;
            mineLevel += 1;
            gems += 2;
            updateUI();
            saveGame();
            tg.showPopup({ title: "Перерождение!", message: `Ты переродился ${prestigeCount} раз` });
        } else {
            tg.showPopup({ title: "Не хватает", message: "Нужно 50 000 золота для перерождения" });
        }
    });
</script>
</body>
</html>
