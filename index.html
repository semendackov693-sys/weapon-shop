<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Idle Weapon Shop 2D</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            user-select: none;
            touch-action: manipulation; /* отключает зумы */
        }
        body {
            margin: 0;
            background: #1a2a1a;
            overflow: hidden;
            font-family: system-ui;
            color: white;
        }
        /* Контейнер игры */
        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            background: #2d3e2d;
        }
        /* UI поверх Canvas */
        .ui-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            padding: 12px;
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px;
            z-index: 10;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
        }
        .ui-panel button {
            pointer-events: auto;
            background: #f5b042;
            border: none;
            padding: 6px 12px;
            border-radius: 30px;
            font-weight: bold;
        }
        .stat {
            background: #000000aa;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .upgrade-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }
        .upgrade-card {
            background: #2c3e2c;
            padding: 4px 8px;
            border-radius: 16px;
            text-align: center;
            pointer-events: auto;
            cursor: pointer;
        }
        @media (max-width: 600px) {
            .stat { font-size: 10px; }
            .upgrade-card { font-size: 10px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <canvas id="gameCanvas" width="1000" height="800"></canvas>
    <div class="ui-panel">
        <div class="stat">💰 <span id="gold">0</span></div>
        <div class="stat">🪨 <span id="ore">0</span></div>
        <div class="stat">⚔️ <span id="weapons">0</span></div>
        <div class="stat">👨‍🏭 <span id="blacksmiths">1</span></div>
        <div class="stat">🏪 Покупатели: <span id="customers">1</span></div>
        <button id="sellBtn">Продать всё</button>
    </div>
    <div class="ui-panel" style="bottom: 70px; background: #000000aa; flex-direction: column;">
        <div class="upgrade-bar">
            <div class="upgrade-card" id="buySmith">⚡ Кузнец<br><span id="smithCost">50</span>💰</div>
            <div class="upgrade-card" id="buyCustomer">🚶 Покупатель<br><span id="custCost">80</span>💰</div>
            <div class="upgrade-card" id="buyForge">🔥 Скорость ковки<br><span id="forgeLevel">0</span></div>
            <div class="upgrade-card" id="buyMineUpgrade">⛏️ Шахта Lv<span id="mineLevel">0</span><br><span id="mineUpCost">100</span>💰</div>
        </div>
    </div>
</div>

<script>
    // ---- ОТКЛЮЧАЕМ ЗУМ ----
    document.addEventListener('touchmove', function(e) {
        if (e.scale !== undefined) e.preventDefault();
    }, { passive: false });
    
    // ---- Telegram Web App ----
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.MainButton.hide();
    
    // ---- 2D МИР И NPC ----
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    
    // Ресурсы игрока
    let gold = 200;
    let ore = 50;
    let weapons = 0;
    let blacksmiths = 1;
    let customers = 1;
    let forgeSpeed = 1;   // множитель производства
    let mineLevel = 0;    // добыча руды в минуту: баз 5 + уровень*3
    let lastTimestamp = Date.now();
    
    // NPC массив
    let npcs = [];
    
    // Функция спавна кузнецов и покупателей
    function spawnNPCs() {
        npcs = [];
        // Кузнецы (ходят к наковальне)
        for(let i=0; i<blacksmiths; i++) {
            npcs.push({
                type: 'smith',
                x: 100 + Math.random() * 200,
                y: 100 + Math.random() * 200,
                targetX: 400, targetY: 300,  // наковальня
                carry: 0
            });
        }
        // Покупатели (ходят к прилавку)
        for(let i=0; i<customers; i++) {
            npcs.push({
                type: 'customer',
                x: 600 + Math.random() * 200,
                y: 500 + Math.random() * 150,
                targetX: 700, targetY: 550,
                buyTimer: 0
            });
        }
        // Торговец оптом
        npcs.push({
            type: 'trader',
            x: 800, y: 100,
            targetX: 800, y: 100,
            stock: 0
        });
    }
    
    // Рисуем карту и NPC
    function drawMap() {
        ctx.clearRect(0, 0, width, height);
        // земля
        ctx.fillStyle = '#3c5e2b';
        ctx.fillRect(0, 0, width, height);
        // дороги
        ctx.fillStyle = '#b87c4f';
        for(let i=0;i<10;i++) ctx.fillRect(i*100, height-80, 70, 10);
        // наковальня (кузница)
        ctx.fillStyle = '#555';
        ctx.fillRect(380, 280, 60, 40);
        ctx.fillStyle = '#888';
        ctx.font = "20px system-ui";
        ctx.fillText("🔨", 395, 315);
        // прилавок
        ctx.fillStyle = '#ac8e5c';
        ctx.fillRect(680, 530, 80, 40);
        ctx.fillStyle = '#f0c674';
        ctx.fillText("🏪", 710, 565);
        // шахта
        ctx.fillStyle = '#4a3e35';
        ctx.fillRect(50, 550, 90, 60);
        ctx.fillStyle = '#aaa';
        ctx.fillText("⛏️", 85, 595);
        
        // NPC
        for(let n of npcs) {
            if(n.type === 'smith') {
                ctx.fillStyle = '#ffaa66';
                ctx.beginPath();
                ctx.arc(n.x, n.y, 12, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = 'black';
                ctx.fillText("👨‍🏭", n.x-10, n.y-5);
            } else if(n.type === 'customer') {
                ctx.fillStyle = '#aad4ff';
                ctx.beginPath();
                ctx.arc(n.x, n.y, 10, 0, Math.PI*2);
                ctx.fill();
                ctx.fillText("🚶", n.x-8, n.y-4);
            } else {
                ctx.fillStyle = '#f5b042';
                ctx.fillRect(n.x-10, n.y-10, 20, 20);
                ctx.fillText("📦", n.x-6, n.y+4);
            }
        }
    }
    
    // Обновление позиций (AI движения)
    function moveNPCs() {
        for(let n of npcs) {
            if(n.type === 'smith') {
                let dx = n.targetX - n.x;
                let dy = n.targetY - n.y;
                let dist = Math.hypot(dx,dy);
                if(dist > 5) {
                    n.x += (dx/dist) * 2;
                    n.y += (dy/dist) * 2;
                } else {
                    // кузнец у наковальни: производит оружие если есть руда
                    if(ore >= 2 && Math.random()<0.1) {
                        ore -= 2;
                        weapons += 1;
                        n.carry++;
                    }
                    // через 1 сек отходит
                    if(Math.random()<0.02) n.targetX = 100+Math.random()*200;
                }
            }
            else if(n.type === 'customer') {
                let dx = n.targetX - n.x;
                let dy = n.targetY - n.y;
                let dist = Math.hypot(dx,dy);
                if(dist > 5) {
                    n.x += (dx/dist) * 1.5;
                    n.y += (dy/dist) * 1.5;
                } else {
                    // покупатель покупает оружие
                    if(weapons > 0 && n.buyTimer <= 0) {
                        let price = 15 + Math.floor(Math.random()*20);
                        weapons -= 1;
                        gold += price;
                        n.buyTimer = 30;
                        tg.HapticFeedback.impactOccurred('light');
                    }
                    if(n.buyTimer > 0) n.buyTimer--;
                    if(Math.random()<0.01) n.targetX = 600+Math.random()*200;
                }
            }
        }
    }
    
    // Idle производство (каждые 2 сек)
    function idleProduction() {
        let now = Date.now();
        let deltaMin = (now - lastTimestamp) / 60000;
        if(deltaMin > 0.1) {
            // руда от шахты
            let oreGain = (5 + mineLevel*3) * deltaMin;
            ore += oreGain;
            // кузнецы пассивно куют
            let weaponGain = blacksmiths * forgeSpeed * deltaMin;
            weapons += weaponGain;
            lastTimestamp = now;
            updateUI();
        }
    }
    setInterval(() => {
        idleProduction();
        moveNPCs();
        drawMap();
        updateUI();
    }, 100);
    
    function updateUI() {
        document.getElementById('gold').innerText = Math.floor(gold);
        document.getElementById('ore').innerText = Math.floor(ore);
        document.getElementById('weapons').innerText = Math.floor(weapons);
        document.getElementById('blacksmiths').innerText = blacksmiths;
        document.getElementById('customers').innerText = customers;
        document.getElementById('smithCost').innerText = Math.floor(50 + blacksmiths*15);
        document.getElementById('custCost').innerText = Math.floor(80 + customers*25);
        document.getElementById('mineLevel').innerText = mineLevel;
        document.getElementById('mineUpCost').innerText = Math.floor(100 + mineLevel*60);
        document.getElementById('forgeLevel').innerText = forgeSpeed;
    }
    
    // Улучшения
    function buyBlacksmith() {
        let cost = 50 + blacksmiths*15;
        if(gold >= cost) {
            gold -= cost;
            blacksmiths++;
            spawnNPCs();
        }
    }
    function buyCustomer() {
        let cost = 80 + customers*25;
        if(gold >= cost) {
            gold -= cost;
            customers++;
            spawnNPCs();
        }
    }
    function buyForge() {
        let cost = 100 + forgeSpeed*40;
        if(gold >= cost) {
            gold -= cost;
            forgeSpeed++;
        }
    }
    function buyMine() {
        let cost = 100 + mineLevel*60;
        if(gold >= cost) {
            gold -= cost;
            mineLevel++;
        }
    }
    function sellAll() {
        if(weapons > 0) {
            let income = weapons * (12 + Math.floor(forgeSpeed*2));
            gold += income;
            weapons = 0;
            tg.HapticFeedback.notificationOccurred('success');
        }
    }
    
    // Привязка кнопок и ресайз
    document.getElementById('sellBtn').onclick = sellAll;
    document.getElementById('buySmith').onclick = buyBlacksmith;
    document.getElementById('buyCustomer').onclick = buyCustomer;
    document.getElementById('buyForge').onclick = buyForge;
    document.getElementById('buyMineUpgrade').onclick = buyMine;
    
    window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        drawMap();
    });
    
    spawnNPCs();
    lastTimestamp = Date.now();
    drawMap();
    updateUI();
</script>
</body>
</html>
