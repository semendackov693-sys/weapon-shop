<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viper Shop Pro</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: sans-serif; background: #0f1015; margin: 0; padding: 0; display: flex; justify-content: center; height: 100vh; color: #fff; user-select: none; -webkit-user-select: none; }
        .screen { width: 100%; max-width: 410px; height: 100vh; background: #1a1a24; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { background: #0f1015; padding: 15px; display: flex; flex-direction: column; align-items: center; border-bottom: 3px solid #4a3b32; }
        .gold-amount { font-size: 32px; font-weight: 900; color: #ffbd59; text-shadow: 0 0 15px rgba(255,189,89,0.4); }
        .forge-view { flex: 1; background: #2e241f; padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .tab-content { display: none; flex-direction: column; gap: 12px; height: 100%; }
        .tab-content.active { display: flex; }
        .workbench-zone { background: rgba(40,30,25,0.7); border: 2px solid #5c4335; border-radius: 16px; height: 145px; position: relative; padding: 10px; box-sizing: border-box; }
        .forge-object { position: absolute; font-size: 24px; }
        .obj-anvil { top: 15px; left: 25px; } .obj-chest { bottom: 15px; left: 25px; }   
        .wb-info-block { position: absolute; right: 10px; top: 10px; bottom: 10px; width: 200px; display: flex; flex-direction: column; justify-content: space-between; background: rgba(20,15,12,0.85); padding: 8px; border-radius: 12px; }
        .wb-meta { display: flex; justify-content: space-between; font-size: 14px; font-weight: 800; }
        .progress-box { background: #140f0c; border-radius: 6px; height: 8px; overflow: hidden; margin: 4px 0; }
        .progress-fill { background: #45f3ff; width: 0%; height: 100%; }
        .mini-up-btn { background: #4a3b32; color: #fff; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 6px 0; width: 100%; font-size: 12px; font-weight: 800; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .mini-up-btn.affordable { background: #ffbd59 !important; color: #0b0c10 !important; }
        .char-worker { position: absolute; font-size: 28px; left: 22px; top: 15px; transition: top 0.1s linear; }
        .clicker-tab-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
        .big-anvil { font-size: 90px; width: 180px; height: 180px; background: rgba(69,243,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .income-pop { position: absolute; color: #00ff88; font-weight: 900; font-size: 18px; animation: popUp 0.5s ease-out forwards; pointer-events: none; }
        @keyframes popUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-35px); opacity: 0; } }
        .bottom-menu { background: #0f1015; height: 75px; display: flex; justify-content: space-around; align-items: center; border-top: 2px solid #4a3b32; }
        .menu-item { display: flex; flex-direction: column; align-items: center; font-size: 20px; opacity: 0.4; cursor: pointer; }
        .menu-item.active { opacity: 1; color: #45f3ff; }
    </style>
</head>
<body>
<div class="screen">
    <div class="top-bar">
        <div class="gold-amount">💰 <span id="gold-display">10.00B</span></div>
    </div>
    <div class="forge-view">
        <div id="tab-forge" class="tab-content active">
            <div class="workbench-zone" id="wb1-zone">
                <div class="forge-object obj-anvil">⚒️</div><div class="forge-object obj-chest">📦</div><div class="char-worker" id="worker1">🧑‍🏭</div>
                <div class="wb-info-block">
                    <div class="wb-meta"><span id="wb1-title">Нож</span><span id="wb1-lvl">Lvl 1</span></div>
                    <div style="color:#00ff88;">+<span id="wb1-income">100M</span> 💰</div>
                    <div class="progress-box"><div class="progress-fill" id="wb1-progress"></div></div>
                    <button class="mini-up-btn" id="wb1-btn" ontouchstart="upgradeWb(1)" mousedown="upgradeWb(1)">Апгрейд: <span id="wb1-cost">500M</span></button>
                </div>
            </div>
            <div class="workbench-zone" id="wb2-zone">
                <div class="forge-object obj-anvil">⚒️</div><div class="forge-object obj-chest">📦</div><div class="char-worker" id="worker2">🧝‍♂️</div>
                <div class="wb-info-block">
                    <div class="wb-meta"><span id="wb2-title">Топор</span><span id="wb2-lvl">Lvl 1</span></div>
                    <div style="color:#00ff88;">+<span id="wb2-income">800M</span> 💰</div>
                    <div class="progress-box"><div class="progress-fill" id="wb2-progress"></div></div>
                    <button class="mini-up-btn" id="wb2-btn" ontouchstart="upgradeWb(2)" mousedown="upgradeWb(2)">Апгрейд: <span id="wb2-cost">2.5B</span></button>
                </div>
            </div>
        </div>
        <div id="tab-clicker" class="tab-content">
            <div class="clicker-tab-zone">
                <div class="big-anvil" id="tap-anvil" ontouchstart="clickAnvil(event)" mousedown="clickAnvil(event)">🔥🔨</div>
                <div style="margin-top:15px; background:rgba(0,0,0,0.4); padding:8px 16px; border-radius:10px;">Тап: <span style="color:#ffbd59">+10.0M 💰</span></div>
            </div>
        </div>
    </div>
    <div class="bottom-menu">
        <div class="menu-item active" id="m-forge" ontouchstart="switchTab('tab-forge', 'm-forge')" mousedown="switchTab('tab-forge', 'm-forge')">🧱<span>Кузня</span></div>
        <div class="menu-item" id="m-click" ontouchstart="switchTab('tab-clicker', 'm-click')" mousedown="switchTab('tab-clicker', 'm-click')">🔨<span>Клик</span></div>
    </div>
</div>
<script>
    const tg = window.Telegram.WebApp; if (tg) { tg.expand(); }
    function format(n) { if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T'; if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B'; if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M'; return n.toFixed(0); }
    let gold = 10000000000;
    let data = {
        1: { level: 1, income: 100000000, cost: 500000000, progress: 0, speed: 1.5 },
        2: { level: 1, income: 800000000, cost: 2500000000, progress: 0, speed: 1.0 }
    };
    const wpNames = { 1: ["Ржавый Нож", "Острый Меч ⚔️", "Палаш Тьмы 🔥"], 2: ["Топорик", "Боевая Секира 🪓", "Разрушитель ⚡"] };

    function showPop(id, txt, x, y) {
        let el = document.getElementById(id); if (!el) return;
        let div = document.createElement("div"); div.className = "income-pop"; div.innerText = txt;
        div.style.left = x + "px"; div.style.top = y + "px"; el.appendChild(div);
        setTimeout(() => div.remove(), 500);
    }

    function updateWbUI(id) {
        let wb = data[id]; let stage = Math.min(Math.floor((wb.level - 1) / 10), 2);
        document.getElementById("wb" + id + "-title").innerText = wpNames[id][stage];
        document.getElementById("wb" + id + "-lvl").innerText = "Lvl " + wb.level;
        document.getElementById("wb" + id + "-income").innerText = format(wb.income);
        document.getElementById("wb" + id + "-cost").innerText = format(wb.cost);
    }

    function updateUI() {
        document.getElementById("gold-display").innerText = format(gold);
        for (let id in data) {
            let btn = document.getElementById("wb" + id + "-btn");
            if (btn) { if (gold >= data[id].cost) btn.classList.add('affordable'); else btn.classList.remove('affordable'); }
        }
    }

    function upgradeWb(id) {
        let wb = data[id];
        if (gold >= wb.cost) {
            gold -= wb.cost; wb.level += 1; wb.income = Math.floor(wb.income * 1.45); wb.cost = Math.floor(wb.cost * 1.55); wb.speed += 0.1;
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            updateWbUI(id); updateUI();
        }
    }

    function switchTab(tId, mId) {
        document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
        document.querySelectorAll('.menu-item').forEach(e => e.classList.remove('active'));
        document.getElementById(tId).classList.add('active'); document.getElementById(mId).classList.add('active');
        if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function clickAnvil(e) {
        gold += 10000000; if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        showPop("tab-clicker", "+10M", 100, 100); updateUI();
    }

    setInterval(() => {
        for (let id in data) {
            let wb = data[id]; wb.progress += wb.speed;
            let worker = document.getElementById("worker" + id);
            if (wb.progress <= 50) {
                let t = 85 - (wb.progress * 2) * 0.7; if (worker) worker.style.top = t + "px";
            } else {
                let t = 15 + ((wb.progress - 50) * 2) * 0.7; if (worker) worker.style.top = t + "px";
            }
            if (wb.progress >= 100) {
                wb.progress = 0; gold += wb.income;
                if (document.getElementById('tab-forge').classList.contains('active')) { showPop("wb" + id + "-zone", "+" + format(wb.income), 25, 95); }
                updateUI();
            }
            let pEl = document.getElementById("wb" + id + "-progress"); if (pEl) pEl.style.width = wb.progress + "%";
        }
    }, 60);

    window.onload = function() { updateWbUI(1); updateWbUI(2); updateUI(); };
</script>
</body>
</html>
