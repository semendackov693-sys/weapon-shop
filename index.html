<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weapon Shop Tycoon Ultimate</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #131316;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; color: white; user-select: none;
        }
        .screen {
            width: 100%; max-width: 390px; height: 100vh; max-height: 844px;
            background: linear-gradient(to bottom, #5d8246, #7da15d);
            box-shadow: 0 0 35px rgba(0,0,0,0.9);
            position: relative; display: flex; flex-direction: column; overflow: hidden;
            border: 4px solid #261c14; box-sizing: border-box;
        }
        .top-bar {
            background: linear-gradient(to bottom, #3a2a1d, #261c14);
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            font-weight: 900; font-size: 20px; border-bottom: 4px solid #d4af37;
        }
        .gold { color: #ffd700; }
        .game-field { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
        .workbench {
            background: #f7e7c4; color: #261c14; width: 100%; border-radius: 16px;
            border: 4px solid #4a3525; padding: 14px; box-shadow: 0 6px 0 #261c14;
            box-sizing: border-box; position: relative;
        }
        .wb-header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 800; border-bottom: 2px dashed #4a3525; padding-bottom: 6px; }
        .wb-level { font-size: 13px; background: #4a3525; color: #fff; padding: 3px 10px; border-radius: 20px; }
        .stars { color: #ff9800; font-size: 12px; margin-top: 2px; }
        .wb-info { font-size: 15px; color: #5a4535; font-weight: 700; margin: 8px 0 4px 0; display: flex; justify-content: space-between; }
        .progress-box {
            background: #d2b48c; border-radius: 12px; height: 20px; width: 100%;
            margin: 8px 0 12px 0; overflow: hidden; border: 3px solid #261c14;
            position: relative;
        }
        .progress-fill {
            background: linear-gradient(to bottom, #72c050, #4caf50);
            width: 0%; height: 100%;
        }
        .up-btn {
            background: linear-gradient(to bottom, #5cb85c, #4cae4c); color: white;
            border: none; border-radius: 12px; padding: 12px 0; width: 100%;
            font-size: 16px; font-weight: 900; cursor: pointer;
            box-shadow: 0 4px 0 #398439;
        }
        .up-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #398439; }
        .income-pop {
            position: absolute; right: 20px; top: 40px; color: #2e7d32;
            font-weight: 900; font-size: 20px;
            animation: popUp 0.6s ease-out forwards; pointer-events: none;
        }
        @keyframes popUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-30px); opacity: 0; }
        }
        .factory-floor {
            width: 100%; height: 90px; background-color: rgba(38, 28, 20, 0.25);
            border-radius: 18px; position: relative; border: 3px dashed #261c14; margin-top: auto;
        }
        .worker { position: absolute; font-size: 28px; bottom: 10px; transition: left 1.1s ease-in-out; }
        .bottom-menu { background: linear-gradient(to bottom, #3a2a1d, #261c14); height: 60px; display: flex; justify-content: space-around; align-items: center; }
        .menu-item { font-size: 26px; }
    </style>
</head>
<body>

<div class="screen">
    <div class="top-bar">
        <div class="gold">💰 <span id="gold-display">10.00B</span></div>
        <div style="font-size: 14px; background: #4a3525; padding: 4px 10px; border-radius: 8px;">🔨 Кузнецы: 3</div>
    </div>

    <div class="game-field">
        <!-- ВЕРСТАК 1 -->
        <div class="workbench" id="wb1-card">
            <div class="wb-header">
                <div>
                    <span id="wb1-icon">🗡️</span> <span id="wb1-title">Ржавый Нож</span>
                    <div class="stars" id="wb1-stars">⭐</div>
                </div>
                <span class="wb-level" id="wb1-lvl">Level 1</span>
            </div>
            <div class="wb-info"><span>Доход:</span><span style="color:#4caf50;">+<span id="wb1-income">100M</span> 💰</span></div>
            <div class="progress-box"><div class="progress-fill" id="wb1-progress"></div></div>
            <button class="up-btn" onclick="upgradeWb(1)">⚡ Апгрейд: <span id="wb1-cost">500M</span></button>
        </div>

        <!-- ВЕРСТАК 2 -->
        <div class="workbench" id="wb2-card">
            <div class="wb-header">
                <div>
                    <span id="wb2-icon">🪓</span> <span id="wb2-title">Топорик</span>
                    <div class="stars" id="wb2-stars">⭐</div>
                </div>
                <span class="wb-level" id="wb2-lvl">Level 1</span>
            </div>
            <div class="wb-info"><span>Доход:</span><span style="color:#4caf50;">+<span id="wb2-income">800M</span> 💰</span></div>
            <div class="progress-box"><div class="progress-fill" id="wb2-progress"></div></div>
            <button class="up-btn" onclick="upgradeWb(2)">⚡ Апгрейд: <span id="wb2-cost">2.5B</span></button>
        </div>

        <!-- ВЕРСТАК 3 -->
        <div class="workbench" id="wb3-card">
            <div class="wb-header">
                <div>
                    <span id="wb3-icon">🪄</span> <span id="wb3-title">Деревянная палочка</span>
                    <div class="stars" id="wb3-stars">⭐</div>
                </div>
                <span class="wb-level" id="wb3-lvl">Level 1</span>
            </div>
            <div class="wb-info"><span>Доход:</span><span style="color:#4caf50;">+<span id="wb3-income">5.0B</span> 💰</span></div>
            <div class="progress-box"><div class="progress-fill" id="wb3-progress"></div></div>
            <button class="up-btn" onclick="upgradeWb(3)">⚡ Апгрейд: <span id="wb3-cost">15.0B</span></button>
        </div>
        
        <div class="factory-floor">
            <div class="worker" id="worker1" style="left: 20px;">🧑‍🏭</div>
            <div class="worker" id="worker2" style="left: 140px;">🧝‍♂️</div>
            <div class="worker" id="worker3" style="right: 20px;">🧙‍♂️</div>
        </div>
    </div>

    <div class="bottom-menu"><div class="menu-item">🔨</div><div class="menu-item">⚔️</div><div class="menu-item">🏪</div></div>
</div>

<script>
    function format(num) {
        if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
        if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
        if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
        if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
        return num.toFixed(0);
    }

    let gold = 10000000000;

    const weaponsData = {
        1: { names: ["Ржавый Нож", "Острый Меч ⚔️", "Палаш Тьмы 🌌", "Эскалибур 🔥"], icons: ["🗡️", "⚔️", "🪦", "🔥"] },
        2: { names: ["Топорик", "Боевой Секира 🪓", "Топор Мясника 🩸", "Уничтожитель Миров ⚡"], icons: ["🪓", "🪓", "🪵", "⚡"] },
        3: { names: ["Деревянная палочка", "Посох Ученика 🔮", "Посох Архимага 🔱", "Скипетр Богов ✨"], icons: ["🪄", "🔮", "🔱", "✨"] }
    };

    let wb1 = { level: 1, income: 100000000, cost: 500000000, progress: 0, speed: 2 };
    let wb2 = { level: 1, income: 800000000, cost: 2500000000, progress: 0, speed: 1.3 };
    let wb3 = { level: 1, income: 5000000000, cost: 15000000000, progress: 0, speed: 0.8 };
    
    let isWorkersRight = true;

    function showPop(cardId, text) {
        const card = document.getElementById(cardId);
        const div = document.createElement("div");
        div.className = "income-pop";
        div.innerText = text;
        card.appendChild(div);
        setTimeout(() => div.remove(), 600);
    }

    function updateWeaponEvo(id, wb) {
        const starsCount = Math.floor(wb.level / 20) + 1;
        const currentTier = Math.min(Math.floor(wb.level / 20), 3);
        
        document.getElementById(`wb${id}-lvl`).innerText = "Level " + wb.level;
        document.getElementById(`wb${id}-income`).innerText = format(wb.income);
        document.getElementById(`wb${id}-cost`).innerText = format(wb.cost);
        document.getElementById(`wb${id}-stars`).innerText = "⭐".repeat(Math.min(starsCount, 5));
        
        document.getElementById(`wb${id}-title`).innerText = weaponsData[id].names[currentTier];
        document.getElementById(`wb${id}-icon`).innerText = weaponsData[id].icons[currentTier];
    }

    setInterval(() => {
        wb1.progress += wb1.speed;
        if (wb1.progress > 100) { wb1.progress = 0; gold += wb1.income; showPop("wb1-card", "+" + format(wb1.income)); }
        document.getElementById("wb1-progress").style.width = wb1.progress + "%";

        wb2.progress += wb2.speed;
        if (wb2.progress > 100) { wb2.progress = 0; gold += wb2.income; showPop("wb2-card", "+" + format(wb2.income)); }
        document.getElementById("wb2-progress").style.width = wb2.progress + "%";

        wb3.progress += wb3.speed;
        if (wb3.progress > 100) { wb3.progress = 0; gold += wb3.income; showPop("wb3-card", "+" + format(wb3.income)); }
        document.getElementById("wb3-progress").style.width = wb3.progress + "%";

        document.getElementById("gold-display").innerText = format(gold);
    }, 40);

    setInterval(() => {
        const w1 = document.getElementById("worker1");
        const w2 = document.getElementById("worker2");
        const w3 = document.getElementById("worker3");
        if (isWorkersRight) {
            w1.style.left = "280px"; w2.style.left = "280px"; w3.style.left = "280px";
        } else {
